<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Motion Controller - Phone Camera</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- MediaPipe Pose & Hands CDN scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/motion_engine.js"></script>
</head>
<body class="phone-body">

  <div class="phone-hud">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
      <div class="logo" style="font-size: 1.1rem;">MOTION<span>CAM</span></div>
      <div class="status-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Connecting...</span>
      </div>
    </div>
    
    <div style="display: flex; gap: 0.5rem; justify-content: center; font-size: 0.8rem; color: var(--accent-cyan); font-family: monospace;">
      <div>MODE: <span id="currentMode">POSE</span></div> | 
      <div>FPS: <span id="fpsVal">0</span></div> | 
      <div>PING: <span id="pingVal">0</span>ms</div>
    </div>
  </div>

  <div class="canvas-wrapper" style="flex: 1; max-height: 65vh; margin: 0.5rem 0;">
    <video id="videoElement" playsinline style="display: none;"></video>
    <canvas id="outputCanvas"></canvas>
    
    <div class="hud-overlay">
      <div class="hud-stat" id="activeModeText">MODE: BODY POSE</div>
      <div class="hud-stat" id="deviceStatusText">CAMERA ACTIVE</div>
    </div>
    
    <div id="triggerBadge" class="trigger-indicator">LOCKED</div>
  </div>

  <div class="card" style="padding: 1rem;">
    <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
      <select id="cameraSelect" style="flex: 1;">
        <option value="user">Front Camera</option>
        <option value="environment">Back Camera</option>
      </select>

      <select id="fpsSelect" style="width: 100px;">
        <option value="30">30 FPS</option>
        <option value="60">60 FPS</option>
        <option value="15">15 FPS</option>
      </select>
    </div>

    <button id="toggleCamBtn" class="btn btn-primary" style="width: 100%;">START CAMERA STREAM</button>
  </div>

  <script src="js/phone_client.js"></script>
</body>
</html>
